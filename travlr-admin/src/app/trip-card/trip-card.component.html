<div class="card h-100">
  <img
    *ngIf="trip.image"
    [src]="'assets/images/' + trip.image"
    class="card-img-top"
    [alt]="trip.name">

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ trip.name }}</h5>
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }} • {{ trip.length }} days
    </h6>

    <p class="card-text flex-grow-1">
      {{ trip.description }}
    </p>

    <p class="fw-bold">
      {{ trip.perPerson | currency:'USD':'symbol':'1.0-0' }} per person
    </p>

    <button class="btn btn-outline-primary mt-auto" (click)="editTrip()">
      Edit
    </button>
  </div>
</div>
