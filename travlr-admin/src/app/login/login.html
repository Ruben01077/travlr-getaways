<h1>Admin Login</h1>

<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="mt-3" style="max-width: 400px;">
  <div class="mb-3">
    <label class="form-label">Username</label>
    <input
      class="form-control"
      name="username"
      [(ngModel)]="username"
      required>
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input
      type="password"
      class="form-control"
      name="password"
      [(ngModel)]="password"
      required>
  </div>

  <button
    type="submit"
    class="btn btn-primary"
    [disabled]="loginForm.invalid">
    Login
  </button>
</form>
